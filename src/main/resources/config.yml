# ===============================================================
# Walk Orbit
#   walk: while moving, vertical particle bands on the left and right of the hips
#   idle: while standing still, particles circle the player and drip downward
#
# Each group:
#   COLOR:    name color in the GUI. A ChatColor name (RED, AQUA...) or a code (&c). Optional.
#   MATERIAL: GUI icon (Bukkit Material name).
#   walk:     particle list used while moving.
#   idle:     particle list used while standing still.
#   walk_shape / idle_shape: optional per-group overrides of the shapes below
#             (e.g. walk_shape: { style: BACK }).
#
# Particle entry keys (all optional except particle):
#   particle: Bukkit particle name. Old pre-1.20.5 names are converted automatically.
#   count: 1    offset: 0    speed: 0    (per point; keep 0 for a crisp shape)
#   chance: 1.0 (0-1, probability per point; use small values for sparse extras)
#   Extra data, only for particles that need it:
#     DUST                         color: "#RRGGBB"  size: 1.0
#     DUST_COLOR_TRANSITION        color: "#RRGGBB"  to_color: "#RRGGBB"  size: 1.0
#     ENTITY_EFFECT, TINTED_LEAVES, FLASH          color: "#RRGGBB"
#     EFFECT, INSTANT_EFFECT       color: "#RRGGBB"  value: 1.0 (power)
#     FALLING_DUST, BLOCK, BLOCK_CRUMBLE, DUST_PILLAR, BLOCK_MARKER   block: <block name>
#     ITEM                         item: <item name>
#     TRAIL   color: "#RRGGBB"  duration: 30 (ticks it stays visible)  fall: 0.3 (blocks it slides down meanwhile)
#             (a dot that flows down to a point below while staying visible)
#     NOTE    note: random (a different colour each time) or 0-24 (fixed pitch/colour)
#
# Keeping any particle visible longer (works for every particle type):
#   linger: 20   ticks to keep the point visible. The client decides how long a particle lasts and
#                the server can't change it, so the plugin re-sends it at the same place instead.
#   refresh: 4   re-send every this many ticks (about how long that particle lasts on its own)
#   fall: 0.3    slide this many blocks down over the linger time (a drip, for any particle)
#     SCULK_CHARGE, DRAGON_BREATH  value: <number>
#   (The older "redstone: { color, size }" block is still accepted.)
# ===============================================================

walk_shape:
  # How the walk particles are laid out:
  #   SIDES        left and right of the hips, fanning out downward (default)
  #   BACK         right behind the back, thick and wide
  #   BACK_SUBTLE  right behind the back, thin and sparse
  #   FEET         low at the feet, thick and wide
  # A group can use a different style with:  walk_shape: { style: FEET }
  style: SIDES

  # Each style comes with its own sizes. Uncomment a key only to override it
  # (an overridden key applies to whichever style is selected here).
  # interval: 2        # ticks between emissions while moving
  # line_top: 1.5      # top of the band, above the feet
  # line_bottom: 0.45  # bottom of the band, above the feet
  # side_offset: 0.6   # SIDES: distance of each band from the body centre
  # back_offset: 0.15  # how far behind the body centre
  # width: 0.0         # sideways width of the band (BACK / BACK_SUBTLE / FEET)
  # points: 5          # particles per band (top to bottom)
  # spread: 0.15       # random horizontal scatter (grows toward the bottom)
  # flare: 0.35        # extra outward push at the bottom, so the band fans out downward
  # step: 0.3          # fill the path walked since the last emission every this many blocks
  # sneak_drop: 0.25   # lower the band by this much while sneaking

idle_shape:
  delay: 10          # ticks standing still before the idle effect starts
  interval: 1        # ticks between emissions
  radius: 0.75       # circle radius around the player
  top: 2.4           # height where drops start
  bottom: 0.1        # height where drops end (then loop back to top)
  strands: 3         # number of drops circling at once
  rotate_speed: 18   # degrees per tick
  fall_speed: 0.04   # blocks per tick (lower = more turns on the way down)
  density: 1         # points drawn per strand per emission (raise to fill gaps when using short-lived particles)

groups:
  # ----- ランク系 -----------------------------------------------
  PREDATOR:              # プレデター: 赤い帯に小さな炎、止まると溶岩が滴る
