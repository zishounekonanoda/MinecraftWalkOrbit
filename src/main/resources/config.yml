  TOTEM:                 # 不死のトーテム: 金と緑の帯にトーテムの粒
    COLOR: YELLOW
    MATERIAL: TOTEM_OF_UNDYING
    walk:
      - { particle: DUST_COLOR_TRANSITION, color: "#F7D24A", to_color: "#5BD65B", size: 0.9 }
      - { particle: TOTEM_OF_UNDYING, chance: 0.05 }
    idle:
      - { particle: TOTEM_OF_UNDYING, chance: 0.5 }

  OMINOUS:               # 不吉: トライアルスポナーの炎、止まると不吉な渦
    COLOR: DARK_BLUE
    MATERIAL: OMINOUS_TRIAL_KEY
    walk:
      - { particle: TRIAL_SPAWNER_DETECTION_OMINOUS, chance: 0.5 }
    idle:
      - { particle: TRIAL_SPAWNER_DETECTION_OMINOUS, chance: 0.6 }
      - { particle: OMINOUS_SPAWNING, chance: 0.04 }

  EMERALD:               # エメラルド: エメラルドのかけらが舞う
    COLOR: GREEN
    MATERIAL: EMERALD
    walk:
      - { particle: DUST, color: "#17DD62", size: 0.9 }
      - { particle: ITEM, item: EMERALD, chance: 0.03 }
    idle:
      - { particle: DUST, color: "#17DD62", size: 0.9 }
      - { particle: ITEM, item: EMERALD, chance: 0.02 }
